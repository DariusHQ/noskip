name: False positive
description: noskip flagged a change that was legitimate.
title: "False positive: "
labels: ["false-positive"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule id
      placeholder: skip-added
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: noskip output
      render: text
  - type: textarea
    id: diff
    attributes:
      label: The diff
      render: diff
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: noskip version
      placeholder: npx noskip --version
